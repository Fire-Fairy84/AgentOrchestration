name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  validate-actions:
    runs-on: ubuntu-latest
    steps:
      # Keep third-party actions pinned to reviewed SHAs. Dependabot opens
      # reviewable PRs when these action refs need to move.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Validate workflow action pins
        run: python3 .github/scripts/validate_action_pins.py

  test:
    runs-on: ubuntu-latest
    needs: validate-actions
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      # Keep third-party actions pinned to reviewed SHAs. Dependabot opens
      # reviewable PRs when these action refs need to move.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf
      - name: Install dependencies
        run: uv sync
      - name: Run tests
        run: uv run pytest --cov=src tests/
      - name: Lint
        run: uv run flake8 src/ tests/
